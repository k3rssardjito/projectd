<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemeriksaan APAR</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    label { font-weight: bold; }
    input, select, button { width: 100%; margin: 8px 0; padding: 8px; }
    #status { margin-top: 10px; font-weight: bold; }
    #apar-info { background: #f1f1f1; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h2>🧯 Pemeriksaan APAR</h2>
  <div id="apar-info">Memuat data...</div>

  <form id="checkForm">
    <label>Tanggal:</label>
    <input type="date" name="tanggal" required>

    <label>Kondisi Tekanan:</label>
    <select name="tekanan" required>
      <option value="">Pilih...</option>
      <option>Normal</option>
      <option>Turun</option>
      <option>Habis</option>
    </select>

    <label>Segel:</label>
    <select name="segel" required>
      <option value="">Pilih...</option>
      <option>Utuh</option>
      <option>Rusak</option>
    </select>

    <label>Nama Petugas:</label>
    <input type="text" name="petugas" placeholder="Nama pemeriksa" required>

    <button type="submit">✅ Simpan Pemeriksaan</button>
  </form>

  <p id="status"></p>

  <script src="script.js"></script>
</body>
</html>
