<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pemeriksaan APAR</title>
</head>
<body>
  <h1>Form Pemeriksaan APAR</h1>
  <p id="apar-info"></p>

  <!-- Iframe tersembunyi untuk submit form -->
  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <form id="checkForm" 
        action="https://script.google.com/macros/s/AKfycbz2cTJl_jXyTgnNcUbG129fX5r9H7ehSt-sSC4kRKX4JMqsL84Ck-wsGqbkXRB8NCZq/exec" 
        method="post" target="hidden_iframe" 
        onsubmit="return formSubmitted();">

    <input type="hidden" name="aparId" id="aparId">
    
    <label>Petugas:</label><br>
    <input type="text" name="petugas" required><br><br>

    <label>Lokasi:</label><br>
    <input type="text" name="lokasi" required><br><br>

    <label>Kondisi:</label><br>
    <select name="kondisi" required>
      <option value="Normal">Normal</option>
      <option value="Perlu Perbaikan">Perlu Perbaikan</option>
    </select><br><br>

    <label>Keterangan:</label><br>
    <textarea name="keterangan"></textarea><br><br>

    <button type="submit">Simpan Pemeriksaan</button>
  </form>

  <p id="status"></p>

  <script src="script.js"></script>
</body>
</html>
